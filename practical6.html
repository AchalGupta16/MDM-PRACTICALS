<!DOCTYPE html>
<html>
<head>
    <title>Student Grade Calculator</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-r from-blue-400 to-blue-600 flex items-center justify-center">

    <div class="bg-white p-8 rounded-xl shadow-lg w-96">

        <h2 class="text-2xl font-bold text-center text-blue-900 mb-6">
            Student Grade Calculator
        </h2>

        <label>Enter Marks of DMGT</label>
        <input type="number" id="m1"
            class="w-full p-2 border rounded mb-4" placeholder="enter your marks">

        <label>Enter Marks of CAO</label>
        <input type="number" id="m2"
            class="w-full p-2 border rounded mb-4" placeholder="enter your marks" >

        <label>Enter Marks of WD</label>
        <input type="number" id="m3"
            class="w-full p-2 border rounded mb-4" placeholder="enter your marks">

        <button onclick="calculate()"
            class="w-full bg-gradient-to-r from-blue-400 to-blue-600 text-white p-2 rounded font-bold">
            Calculate Result
        </button>

        <div id="result"
            class="mt-5 p-4 bg-purple-50 rounded text-center">
        </div>

    </div>


    <script>

        function calculate() {

            let m1 = Number(document.getElementById("m1").value);
            let m2 = Number(document.getElementById("m2").value);
            let m3 = Number(document.getElementById("m3").value);

            let total = m1 + m2 + m3;

            let percentage = total / 3;

            let grade;

            if (percentage >= 90) {
                grade = "A+";
            }
            else if (percentage >= 80) {
                grade = "A";
            }
            else if (percentage >= 70) {
                grade = "B";
            }
            else if (percentage >= 60) {
                grade = "C";
            }
            else if (percentage >= 40) {
                grade = "D";
            }
            else {
                grade = "F";
            }

            document.getElementById("result").innerHTML =
                "Total Marks: " + total + "<br>" +
                "Percentage: " + percentage + "%<br>" +
                "Grade: " + grade;
        }

    </script>

</body>
</html>
